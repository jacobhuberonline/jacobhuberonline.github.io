name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install, check, build, verify, and upload site
        uses: withastro/action@v6
        with:
          node-version: '24'
          build-cmd: git diff --exit-code -- package-lock.json && npm ci && npm run check && npm run build && npm run verify

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-search:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out public search notification script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Notify IndexNow after publishing
        id: indexnow
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
      - name: Report a search notification failure
        if: steps.indexnow.outcome == 'failure'
        run: echo '::warning::The site deployed successfully, but IndexNow notification failed. Check the preceding step and resubmit after resolving the error.'
